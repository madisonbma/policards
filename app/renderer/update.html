<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>Update Data</title>
  <link rel="stylesheet" href="update.css">
</head>
<body>
  <div class="container">
    <h1>Update Data</h1>
    <button id="manualInsertBtn">Manually Insert New Data</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
  </div>

  <!-- Manual Insert Modal -->
  <div class="modal" id="manualInsertModal">
    <div class="modal-content">
      <h2>Manual Data Entry</h2>
      
      <!-- Step 1: Name Selection -->
      <div id="step1" class="step">
        <label for="nameInput">Enter representative name:</label>
        <input type="text" id="nameInput" placeholder="Enter name...">
        <div id="nameSuggestions" class="suggestions"></div>
        <button id="nameSubmitBtn">Continue</button>
        <button id="cancelBtn" class="secondary">Cancel</button>
      </div>

      <!-- Step 2: Field Selection -->
      <div id="step2" class="step hidden">
        <p><strong>Representative:</strong> <span id="selectedName"></span></p>
        <label for="fieldSelect">Select field to edit:</label>
        <select id="fieldSelect">
          <option value="">-- Select a field --</option>
          <option value="url">URL</option>
          <option value="imageUrl">Image URL</option>
          <option value="endYear">End Year</option>
          <option value="committees">Committees</option>
          <option value="photo">Photo</option>
          <option value="birthDate">Birth Date</option>
          <option value="education">Education</option>
          <option value="military">Military</option>
          <option value="illegal">Illegal Activities</option>
          <option value="failed_runs">Failed Runs</option>
          <option value="work_history">Work History</option>
          <option value="congress_highlights">Congress Highlights</option>
          <option value="accolades">Accolades</option>
          <option value="family">Family</option>
          <option value="birthplace">Birthplace</option>
        </select>
        <button id="fieldSubmitBtn">Continue</button>
        <button id="backToNameBtn" class="secondary">Back</button>
      </div>

      <!-- Step 3: Confirm Current Value -->
      <div id="step3" class="step hidden">
        <p><strong>Representative:</strong> <span id="selectedName2"></span></p>
        <p><strong>Field:</strong> <span id="selectedField"></span></p>
        <p><strong>Current Value:</strong></p>
        <div id="currentValue" class="current-value"></div>
        <p>Do you want to update this field?</p>
        <button id="confirmUpdateBtn">Yes, Update</button>
        <button id="backToFieldBtn" class="secondary">Back</button>
      </div>

      <!-- Step 4: Enter New Value -->
      <div id="step4" class="step hidden">
        <p><strong>Representative:</strong> <span id="selectedName3"></span></p>
        <p><strong>Field:</strong> <span id="selectedField2"></span></p>
        <label for="valueInput" id="valueLabel">Enter new value:</label>
        <input type="text" id="valueInput" placeholder="Enter value...">
        <button id="saveBtn">Save</button>
        <button id="backToConfirmBtn" class="secondary">Back</button>
      </div>

      <!-- Step 5: Success -->
      <div id="step5" class="step hidden">
        <div class="success-message">
          <h3>✓ Successfully Updated!</h3>
          <p>The data has been saved to supplement_congressmen.json</p>
        </div>
        <button id="closeModalBtn">Close</button>
        <button id="addAnotherBtn" class="secondary">Add Another Field</button>
      </div>
    </div>
  </div>

  <script src="update-renderer.js"></script>
</body>
</html>
